<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF 문서 요약</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E%F0%9F%93%84%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f6fa; --surface:#ffffff; --text:#1c2033; --muted:#5f667d; --border:#dfe2ec;
  --primary:#4f46e5; --primary-h:#4338ca; --primary-soft:#eef0ff; --on-primary:#fff;
  --ok:#15803d; --err:#b42318; --err-soft:#fdecea; --warn:#92400e; --warn-soft:#fff4e0;
  --shadow:0 1px 3px rgba(20,24,50,.08),0 8px 24px rgba(20,24,50,.06);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1220; --surface:#181c30; --text:#e8eaf5; --muted:#a3a9c4; --border:#2b3150;
    --primary:#818cf8; --primary-h:#a5b0ff; --primary-soft:#23284a; --on-primary:#10132a;
    --ok:#4ade80; --err:#ff8a80; --err-soft:#3a1a1a; --warn:#fbbf6a; --warn-soft:#3a2a12;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 48px}
header{padding:32px 0 20px}
h1{margin:0;font-size:1.7rem;letter-spacing:-.02em}
.sub{margin:4px 0 0;color:var(--muted)}
[hidden]{display:none!important}
.banner{border-radius:12px;padding:14px 16px;margin-bottom:16px;border:1px solid}
.banner.err{background:var(--err-soft);border-color:var(--err);color:var(--err)}
.banner.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.banner strong{display:block;margin-bottom:4px}
.cmd{display:block;margin-top:8px;padding:8px 12px;border-radius:8px;background:rgba(0,0,0,.08);color:var(--text);overflow-x:auto;white-space:nowrap;font-family:Consolas,"D2Coding",monospace}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.drop{border:2px dashed var(--border);border-radius:16px;padding:36px 20px;text-align:center;cursor:pointer;background:var(--surface);transition:.15s;outline:none}
.drop:hover,.drop:focus-visible{border-color:var(--primary);background:var(--primary-soft)}
.drop:focus-visible{box-shadow:0 0 0 3px var(--primary-soft),0 0 0 5px var(--primary)}
.drop.dragover{border-color:var(--primary);background:var(--primary-soft);transform:scale(1.01)}
.drop.disabled{opacity:.6;cursor:not-allowed}
.drop .ico{font-size:2.4rem}
.drop .t{font-weight:700;font-size:1.1rem;margin:6px 0 12px}
.drop .s{color:var(--muted);font-size:.9rem;margin-top:12px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:8px 14px}
button:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
button.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary);font-weight:700}
button.primary:hover:not(:disabled){background:var(--primary-h);color:var(--on-primary)}
.note{margin-top:12px;color:var(--warn);background:var(--warn-soft);border-radius:10px;padding:8px 12px;font-size:.9rem}
.status{display:flex;align-items:center;gap:12px}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--primary);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.stage{font-weight:700}
.elapsed{color:var(--muted);font-size:.9rem;margin-top:2px}
.bar{height:6px;background:var(--border);border-radius:6px;overflow:hidden;margin-top:14px}
.bar>i{display:block;height:100%;width:30%;background:var(--primary);border-radius:6px;animation:slide 1.4s ease-in-out infinite}
@keyframes slide{0%{margin-left:-30%}100%{margin-left:100%}}
.errbox{border-color:var(--err);background:var(--err-soft);color:var(--err)}
.errbox .em{font-weight:700;margin:0 0 4px}
.errbox .ec{font-size:.8rem;opacity:.85}
.errbox .acts{margin-top:12px}
dl.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:0}
dl.meta div{background:var(--primary-soft);border-radius:12px;padding:10px 12px}
dl.meta dt{font-size:.78rem;color:var(--muted)}
dl.meta dd{margin:0;font-weight:700;overflow-wrap:anywhere}
h2{font-size:1rem;margin:0 0 10px;color:var(--primary)}
.oneline{font-size:1.2rem;font-weight:700;line-height:1.5;margin:0}
.kp{margin:0;padding-left:1.2rem}
.kp li{margin:6px 0}
.detail p{margin:0 0 .9em}
.detail p:last-child{margin:0}
.rmeta{color:var(--muted);font-size:.9rem;margin:0 0 12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.toolbar .sp{flex:1}
.notice{color:var(--muted);font-size:.82rem;text-align:center;margin-top:24px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:520px){h1{font-size:1.4rem}.drop{padding:26px 12px}.toolbar .sp{display:none}.toolbar button{flex:1 1 auto}}
@media (prefers-reduced-motion:reduce){*{animation-duration:3s!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="app-title">PDF 문서 요약</h1>
    <p class="sub">PDF를 끌어다 놓으면 AI가 한 줄 요약, 핵심 포인트, 상세 요약을 만들어 드립니다.</p>
  </header>

  <div id="server-banner" class="banner err" role="alert" hidden></div>

  <section id="upload-sec">
    <div id="drop-zone" class="drop" tabindex="0" role="button" aria-label="PDF 파일을 여기로 끌어다 놓거나 Enter 키로 파일 선택">
      <div class="ico" aria-hidden="true">📄</div>
      <div class="t">PDF 파일을 여기로 끌어다 놓거나</div>
      <button type="button" id="file-button" class="primary">파일 선택</button>
      <div class="s">최대 20MB, PDF만 지원</div>
    </div>
    <input id="file-input" class="sr" type="file" accept=".pdf,application/pdf" tabindex="-1" aria-hidden="true">
    <div id="drop-note" class="note" hidden></div>
  </section>

  <section id="status" class="card" aria-live="polite" hidden>
    <div class="status">
      <div class="spin" aria-hidden="true"></div>
      <div><div class="stage" id="stage"></div><div class="elapsed" id="elapsed"></div></div>
    </div>
    <div class="bar" aria-hidden="true"><i></i></div>
  </section>

  <section id="doc-info" class="card" hidden><dl class="meta" id="doc-meta"></dl></section>

  <section id="error-box" class="card errbox" role="alert" hidden>
    <p class="em" id="err-msg"></p>
    <div class="ec" id="err-code"></div>
    <div class="acts"><button type="button" class="primary" id="retry-button">다시 시도</button></div>
  </section>

  <div id="actions" class="toolbar" hidden>
    <button type="button" id="copy-button">복사</button>
    <button type="button" id="download-button">다운로드</button>
    <span class="sp"></span>
    <button type="button" id="reset-button">다른 파일 요약하기</button>
  </div>

  <section id="result" hidden>
    <p class="rmeta" id="result-meta"></p>
    <div class="card"><h2>한 줄 요약</h2><p class="oneline" id="one-line"></p></div>
    <div class="card"><h2>핵심 포인트</h2><ul class="kp" id="key-points"></ul></div>
    <div class="card"><h2>상세 요약</h2><div class="detail" id="detailed"></div></div>
  </section>

  <p class="notice" id="notice">업로드한 문서 내용은 요약을 위해 외부 AI 서비스(OpenRouter)로 전송됩니다.</p>
</div>

<script>
(function () {
  'use strict';
  var API_BASE = location.protocol === 'file:' ? 'http://localhost:8000' : '';
  var MAX_BYTES = 20 * 1024 * 1024;
  var MAX_CHARS = 300000;
  var TIMEOUT_MS = 120000;            // 업로드·헬스체크
  var SUMMARIZE_TIMEOUT_MS = 200000;  // 서버 전체 상한(180초)의 AI_TIMEOUT 응답을 먼저 받을 수 있도록 여유

  var MSG = {
    INVALID_FILE_TYPE: 'PDF 파일만 업로드할 수 있습니다.',
    EMPTY_FILE: '빈 파일입니다. 내용이 있는 PDF를 업로드해 주세요.',
    FILE_TOO_LARGE: '파일 크기가 20MB를 초과합니다. 20MB 이하의 PDF를 업로드해 주세요.',
    TEXT_TOO_LONG: '문서가 너무 길어 요약할 수 없습니다. (최대 300,000자)',
    NETWORK_ERROR: '서버에 연결할 수 없습니다. 백엔드 서버(uvicorn backend.main:app --port 8000)가 실행 중인지 확인해 주세요.',
    NO_KEY: 'AI API 키가 설정되지 않아 요약을 사용할 수 없습니다.',
    TIMEOUT: '응답 시간이 너무 오래 걸려 중단했습니다. 다시 시도해 주세요.'
  };
  var START_CMD = 'python -m uvicorn backend.main:app --port 8000';

  var $ = function (id) { return document.getElementById(id); };
  var el = {};
  ['server-banner', 'drop-zone', 'file-button', 'file-input', 'drop-note', 'status', 'stage', 'elapsed',
   'doc-info', 'doc-meta', 'error-box', 'err-msg', 'err-code', 'retry-button', 'actions', 'copy-button',
   'download-button', 'reset-button', 'result', 'result-meta', 'one-line', 'key-points', 'detailed']
    .forEach(function (id) { el[id] = $(id); });

  // idle | uploading | summarizing | done | error
  var S = { phase: 'idle', file: null, upload: null, data: null, timer: null, t0: 0, ctrl: null, runId: 0 };

  function fmtSize(b) { return b < 1048576 ? (b / 1024).toFixed(1) + ' KB' : (b / 1048576).toFixed(2) + ' MB'; }
  function fmtNum(n) { return typeof n === 'number' ? n.toLocaleString('ko-KR') : '-'; }
  function show(e, on) { e.hidden = !on; }
  function busy() { return S.phase === 'uploading' || S.phase === 'summarizing'; }

  // ---------- API ----------
  function ApiError(code, message) { this.code = code; this.message = message; }
  function request(path, opts, timeoutMs) {
    var ctrl = new AbortController(), timedOut = false;
    S.ctrl = ctrl;
    var to = setTimeout(function () { timedOut = true; ctrl.abort(); }, timeoutMs || TIMEOUT_MS);
    opts = opts || {}; opts.signal = ctrl.signal;
    return fetch(API_BASE + path, opts).then(function (res) {
      return res.text().then(function (txt) {
        var json = null;
        try { json = JSON.parse(txt); } catch (e) { /* non-JSON */ }
        if (!res.ok) {
          if (json && json.error && json.error.message) throw new ApiError(json.error.code || 'UNKNOWN_ERROR', String(json.error.message));
          throw new ApiError('UNKNOWN_ERROR', '알 수 없는 오류가 발생했습니다. (HTTP ' + res.status + ')');
        }
        if (json === null || typeof json !== 'object') throw new ApiError('UNKNOWN_ERROR', '알 수 없는 오류가 발생했습니다. (HTTP ' + res.status + ')');
        return json;
      });
    }, function (err) {
      if (timedOut) throw new ApiError('CLIENT_TIMEOUT', MSG.TIMEOUT);
      if (err && err.name === 'AbortError') throw new ApiError('ABORTED', '요청이 취소되었습니다.');
      throw new ApiError('NETWORK_ERROR', MSG.NETWORK_ERROR);
    }).then(function (v) { clearTimeout(to); return v; }, function (e) { clearTimeout(to); throw e; });
  }

  // ---------- 서버 배너 ----------
  function banner(kind, text, cmd) {
    var b = el['server-banner'];
    b.className = 'banner ' + kind;
    b.textContent = '';
    var s = document.createElement('strong'); s.textContent = text; b.appendChild(s);
    if (cmd) {
      var p = document.createElement('span'); p.textContent = '프로젝트 폴더에서 아래 명령으로 서버를 실행한 뒤 페이지를 새로고침하세요.'; b.appendChild(p);
      var c = document.createElement('code'); c.className = 'cmd'; c.textContent = cmd; b.appendChild(c);
    }
    show(b, true);
  }
  function checkHealth() {
    return request('/api/health').then(function (h) {
      if (h && h.api_key_configured === false) banner('warn', MSG.NO_KEY);
      else show(el['server-banner'], false);
    }).catch(function () { banner('err', MSG.NETWORK_ERROR, START_CMD); });
  }

  // ---------- 상태 표시 ----------
  function stopTimer() { clearInterval(S.timer); S.timer = null; }
  function startTimer() {
    stopTimer(); S.t0 = Date.now();
    var tick = function () {
      var s = Math.floor((Date.now() - S.t0) / 1000);
      el.elapsed.textContent = '경과 시간 ' + s + '초';
    };
    tick(); S.timer = setInterval(tick, 500);
  }
  function setPhase(p) {
    S.phase = p;
    var b = busy();
    el['drop-zone'].classList.toggle('disabled', b);
    el['drop-zone'].setAttribute('aria-disabled', b ? 'true' : 'false');
    el['file-button'].disabled = b;
    el['file-input'].disabled = b;
    show(el.status, b);
    if (p === 'uploading') el.stage.textContent = '1/2 · PDF 업로드 및 텍스트 추출 중...';
    if (p === 'summarizing') el.stage.textContent = '2/2 · AI가 요약하는 중입니다... (최대 1~3분 소요될 수 있습니다)';
    if (b) { show(el['error-box'], false); show(el.result, false); show(el.actions, false); }
    if (!b) stopTimer();
  }
  function showError(code, message) {
    setPhase('error');
    el['err-msg'].textContent = message;
    el['err-code'].textContent = code ? '오류 코드: ' + code : '';
    show(el['error-box'], true);
    show(el.actions, true);
    el['copy-button'].hidden = true; el['download-button'].hidden = true;
    if (code === 'NETWORK_ERROR') checkHealth();
  }

  // ---------- 흐름 ----------
  function validate(file) {
    if (!/\.pdf$/i.test(file.name)) return ['INVALID_FILE_TYPE', MSG.INVALID_FILE_TYPE];
    if (file.size === 0) return ['EMPTY_FILE', MSG.EMPTY_FILE];
    if (file.size > MAX_BYTES) return ['FILE_TOO_LARGE', MSG.FILE_TOO_LARGE];
    return null;
  }
  function pickFiles(files) {
    if (busy() || !files || !files.length) return;
    show(el['drop-note'], false);
    if (files.length > 1) {
      el['drop-note'].textContent = '한 번에 하나의 파일만 요약할 수 있습니다. 첫 번째 파일만 처리합니다.';
      show(el['drop-note'], true);
    }
    var file = files[0];
    clearView();
    S.file = file; S.upload = null; S.data = null;
    var bad = validate(file);
    if (bad) { showError(bad[0], bad[1]); return; }
    run();
  }
  function clearView() {
    show(el['error-box'], false); show(el.result, false); show(el.actions, false); show(el['doc-info'], false);
    el['copy-button'].hidden = false; el['download-button'].hidden = false;
  }
  function run() {
    var id = ++S.runId, p;
    if (S.upload) {
      p = Promise.resolve(S.upload);
    } else {
      setPhase('uploading'); startTimer();
      var fd = new FormData(); fd.append('file', S.file, S.file.name);
      p = request('/api/upload', { method: 'POST', body: fd }).then(function (u) {
        if (id !== S.runId) throw new ApiError('ABORTED', '');
        if (typeof u.text !== 'string') throw new ApiError('UNKNOWN_ERROR', '알 수 없는 오류가 발생했습니다. (HTTP 200)');
        S.upload = u; renderDocInfo(u); return u;
      });
    }
    p.then(function (u) {
      var chars = (u.metadata && typeof u.metadata.char_count === 'number') ? u.metadata.char_count : u.text.length;
      if (chars > MAX_CHARS) throw new ApiError('TEXT_TOO_LONG', MSG.TEXT_TOO_LONG);
      setPhase('summarizing'); if (!S.timer) startTimer();
      return request('/api/summarize', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: u.text, filename: (u.metadata && u.metadata.filename) || S.file.name })
      }, SUMMARIZE_TIMEOUT_MS);
    }).then(function (r) {
      if (id !== S.runId) return;
      if (!r || !r.summary || !Array.isArray(r.summary.key_points)) throw new ApiError('UNKNOWN_ERROR', '알 수 없는 오류가 발생했습니다. (HTTP 200)');
      S.data = r; renderResult(r);
    }).catch(function (e) {
      if (id !== S.runId || (e && e.code === 'ABORTED')) return;
      if (!(e instanceof ApiError)) e = new ApiError('UNKNOWN_ERROR', '알 수 없는 오류가 발생했습니다.');
      showError(e.code, e.message);
    });
  }

  // ---------- 렌더링 ----------
  function metaItem(label, value) {
    var d = document.createElement('div');
    var dt = document.createElement('dt'); dt.textContent = label;
    var dd = document.createElement('dd'); dd.textContent = value;
    d.appendChild(dt); d.appendChild(dd); el['doc-meta'].appendChild(d);
  }
  function renderDocInfo(u) {
    var m = u.metadata || {};
    el['doc-meta'].textContent = '';
    metaItem('파일명', m.filename || S.file.name);
    metaItem('페이지 수', fmtNum(m.page_count) + '쪽');
    metaItem('글자 수', fmtNum(typeof m.char_count === 'number' ? m.char_count : u.text.length) + '자');
    if (m.title) metaItem('제목', m.title);
    if (m.author) metaItem('작성자', m.author);
    show(el['doc-info'], true);
  }
  function seconds(r) {
    if (typeof r.elapsed_ms === 'number') return r.elapsed_ms / 1000;
    if (typeof r.elapsed_seconds === 'number') return r.elapsed_seconds;
    return null;
  }
  function renderResult(r) {
    var s = r.summary, sec = seconds(r);
    setPhase('done');
    var meta = '사용 모델: ' + (r.model || '-') + (r.fallback_used ? ' (대체 모델 사용)' : '') +
      ' · 소요 시간: ' + (sec == null ? '-' : sec.toFixed(1)) + '초';
    el['result-meta'].textContent = meta;
    el['one-line'].textContent = s.one_line || '';
    el['key-points'].textContent = '';
    s.key_points.forEach(function (k) {
      var li = document.createElement('li'); li.textContent = k; el['key-points'].appendChild(li);
    });
    el.detailed.textContent = '';
    String(s.detailed || '').split(/\n{2,}/).forEach(function (para) {
      if (!para.trim()) return;
      var p = document.createElement('p'); p.textContent = para.trim(); el.detailed.appendChild(p);
    });
    el['copy-button'].hidden = false; el['download-button'].hidden = false;
    show(el.result, true); show(el.actions, true);
    el.result.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ---------- 복사 / 다운로드 ----------
  function baseName() { return (S.file ? S.file.name : 'summary').replace(/\.pdf$/i, ''); }
  function buildMd() {
    var r = S.data, s = r.summary, sec = seconds(r);
    var L = ['# ' + baseName() + ' 요약', '', '## 한 줄 요약', s.one_line, '', '## 핵심 포인트'];
    s.key_points.forEach(function (k) { L.push('- ' + k); });
    L.push('', '## 상세 요약', s.detailed, '', '---',
      '모델: ' + (r.model || '-') + ' / 소요 시간: ' + (sec == null ? '-' : sec.toFixed(1)) + '초');
    return L.join('\n') + '\n';
  }
  var copyTimer;
  function copyFeedback(msg) {
    el['copy-button'].textContent = msg;
    clearTimeout(copyTimer);
    copyTimer = setTimeout(function () { el['copy-button'].textContent = '복사'; }, 2000);
  }
  function copy() {
    if (!S.data) return;
    var text = buildMd();
    var fallback = function () {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      ta.remove();
      copyFeedback(ok ? '복사되었습니다' : '복사에 실패했습니다.');
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { copyFeedback('복사되었습니다'); }, fallback);
    } else fallback();
  }
  function download() {
    if (!S.data) return;
    var blob = new Blob([buildMd()], { type: 'text/markdown;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = baseName() + '_요약.md';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  function resetAll() {
    S.runId++;
    if (S.ctrl) { try { S.ctrl.abort(); } catch (e) {} }
    S.file = null; S.upload = null; S.data = null;
    clearView(); show(el['drop-note'], false);
    el['file-input'].value = '';
    setPhase('idle');
    el['drop-zone'].focus();
  }

  // ---------- 이벤트 ----------
  function openPicker() { if (!busy()) el['file-input'].click(); }
  el['drop-zone'].addEventListener('click', openPicker);
  el['file-button'].addEventListener('click', function (e) { e.stopPropagation(); openPicker(); });
  el['drop-zone'].addEventListener('keydown', function (e) {
    if (e.target === el['drop-zone'] && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openPicker(); }
  });
  el['file-input'].addEventListener('change', function () {
    var files = Array.prototype.slice.call(el['file-input'].files || []);
    el['file-input'].value = '';
    pickFiles(files);
  });
  ['dragenter', 'dragover'].forEach(function (ev) {
    el['drop-zone'].addEventListener(ev, function (e) {
      e.preventDefault();
      if (!busy()) el['drop-zone'].classList.add('dragover');
    });
  });
  el['drop-zone'].addEventListener('dragleave', function (e) {
    e.preventDefault(); el['drop-zone'].classList.remove('dragover');
  });
  el['drop-zone'].addEventListener('drop', function (e) {
    e.preventDefault(); e.stopPropagation();
    el['drop-zone'].classList.remove('dragover');
    if (busy()) return;
    pickFiles(Array.prototype.slice.call((e.dataTransfer && e.dataTransfer.files) || []));
  });
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('drop', function (e) { e.preventDefault(); });

  el['retry-button'].addEventListener('click', function () {
    if (busy()) return;
    if (S.upload && S.file) { show(el['error-box'], false); show(el.actions, false); run(); }  // 요약만 재호출
    else openPicker();                                                                       // 업로드 실패: 파일 재선택
  });
  el['reset-button'].addEventListener('click', resetAll);
  el['copy-button'].addEventListener('click', copy);
  el['download-button'].addEventListener('click', download);

  setPhase('idle');
  checkHealth();
})();
</script>
</body>
</html>
